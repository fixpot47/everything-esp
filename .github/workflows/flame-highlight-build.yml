name: Build Flame Highlight 26.2
on:
  push:
    branches: [flame-highlight-fabric-26.2]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Compile Fabric jar
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Flame-Highlight-26.2-Fabric-JAR
          path: build/libs/flame-highlight-26.2-fabric-1.0.0.jar
          if-no-files-found: error
